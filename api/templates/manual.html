{% extends "base.html" %}
{% block content %}
<h2><i class="fas fa-hand-pointer"></i> Traducción Manual por Selección</h2>
<p class="text-sm">Utilice los buscadores desplegables para localizar y traducir un recurso específico inmediatamente.</p>

<form method="POST" action="{{ url_for('main.manual_translate') }}" class="card" id="manualForm" style="padding-bottom: 30px;">
    
    <label><i class="fas fa-layer-group"></i> Seleccione el Tipo de Recurso:</label>
    <select name="target_type" id="target_type" class="select2-enable" required>
        <option value="" disabled selected>Seleccione un tipo...</option>
        <option value="page">Páginas Estáticas</option>
        <option value="collection">Colecciones del CMS</option>
        <option value="component">Componentes (Símbolos)</option>
    </select>

    <div id="target_container" style="display: none; margin-top: 20px;">
        <label id="target_label"><i class="fas fa-bullseye"></i> Busque el Recurso Específico:</label>
        <select name="target_id" id="target_id" class="select2-enable" required>
            <!-- Llenado dinámicamente -->
        </select>
    </div>

    <div id="item_container" style="display: none; margin-top: 20px;">
        <label><i class="fas fa-file-alt"></i> Busque el Post / Ítem Específico:</label>
        <select name="item_id" id="item_id" class="select2-enable">
            <option value="all">⚡ Traducir TODOS los posts de esta colección</option>
        </select>
    </div>

    <button type="submit" id="submitBtn" style="width:100%; display:none; margin-top: 25px;"><i class="fas fa-language"></i> Ejecutar Traducción Forzada</button>
    <p class="text-sm" style="color: #fca5a5; margin-top: 15px;"><i class="fas fa-exclamation-triangle"></i> Nota: Esta ejecución manual omite los límites de seguridad de consumo y sobreescribirá el contenido.</p>
</form>

<script>
    const pages = [
        {"id": "all", "name": "⚡ Traducir TODAS las páginas estáticas"},
        {% for p in pages %} {"id": "{{ p.id }}", "name": "{{ p.title|replace('"', '\\"') }}"}, {% endfor %}
    ];
    const collections = [
        {"id": "all", "name": "⚡ Traducir TODAS las colecciones del CMS"},
        {% for c in collections %} {"id": "{{ c.id }}", "name": "{{ c.displayName|replace('"', '\\"') }}"}, {% endfor %}
    ];
    const components = [
        {"id": "all", "name": "⚡ Traducir TODOS los componentes"},
        {% for c in components %} {"id": "{{ c.id }}", "name": "{{ c.name|replace('"', '\\"') }}"}, {% endfor %}
    ];

    function fillOptions(selectId, dataArray) {
        let select = $('#' + selectId);
        select.empty();
        dataArray.forEach(item => {
            let option = new Option(item.name, item.id, false, false);
            select.append(option);
        });
        select.trigger('change.select2');
    }

    $('#target_type').on('change', function() {
        $('#target_container').show();
        $('#item_container').hide();
        $('#submitBtn').show();
        
        let type = $(this).val();
        if (type === 'page') fillOptions('target_id', pages);
        else if (type === 'collection') fillOptions('target_id', collections);
        else if (type === 'component') fillOptions('target_id', components);
    });

    $('#target_id').on('change', function() {
        let type = $('#target_type').val();
        let targetId = $(this).val();

        if (type === 'collection' && targetId !== 'all' && targetId !== null) {
            $('#item_container').show();
            $('#item_id').empty().append(new Option('Cargando posts desde Webflow...', 'all', true, true)).trigger('change.select2');
            
            fetch('/api/items/' + targetId)
                .then(res => res.json())
                .then(data => {
                    let itemsArray = [{"id": "all", "name": "⚡ Traducir TODOS los posts de esta colección"}];
                    data.forEach(i => itemsArray.push({"id": i.id, "name": i.name}));
                    fillOptions('item_id', itemsArray);
                });
        } else {
            $('#item_container').hide();
        }
    });
</script>
{% endblock %}
