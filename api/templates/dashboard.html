{% extends "base.html" %}
{% block content %}
<h2><i class="fas fa-tachometer-alt"></i> Dashboard y Configuración</h2>

<div class="card">
    <h3 style="margin-top: 0;"><i class="fas fa-chart-line"></i> Consumo de DeepL</h3>
    <p style="font-size: 1.2em; font-weight: bold; color: #86efac;">{{ usage }}</p>
    <p class="text-sm"><i class="fas fa-clock"></i> Hora local del Servidor (Colombia): {{ current_time }}</p>
</div>

<h3><i class="fas fa-key"></i> Configuración de APIs</h3>
<form method="POST">
    <label>DeepL API Key:</label>
    <input type="password" name="deepl_key" value="{{ config.deepl_api_key or '' }}" required>
    
    <label>Webflow API Token:</label>
    <input type="password" name="webflow_token" value="{{ config.webflow_token or '' }}" required>
    
    <label>Webflow Site ID:</label>
    <input type="text" name="site_id" value="{{ config.site_id or '' }}" required>
    
    <hr style="border: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
    <h4><i class="fas fa-envelope"></i> Alertas de Seguridad por Correo (SMTP)</h4>

    <label>Correo Electrónico a Notificar:</label>
    <input type="email" name="admin_email" value="{{ config.admin_email or 'emanueel031@gmail.com' }}" required>

    <label>Correo Emisor SMTP (Google):</label>
    <input type="email" name="smtp_email" value="{{ config.smtp_email or 'supportitgv@gmail.com' }}" required>

    <label>Contraseña de Aplicación SMTP:</label>
    <input type="password" name="smtp_password" value="{{ config.smtp_password or '' }}" placeholder="Ingrese la contraseña de aplicación de 16 caracteres">

    <button type="submit" style="margin-top: 15px;"><i class="fas fa-save"></i> Guardar Toda la Configuración</button>
</form>
{% endblock %}
