{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: auto; text-align: center;">
    <h2>Acceso Seguro | Domoblock</h2>
    <p>Ingresa tus datos administrativos para continuar.</p>
    <form method="POST" style="text-align: left;">
        <label>Usuario:</label>
        <input type="text" name="username" required>
        
        <label>Contraseña:</label>
        <input type="password" name="password" required>
        
        <script src="https://www.google.com/recaptcha/api.js" async defer></script>
        <div class="g-recaptcha" data-sitekey="6Lcomo4tAAAAAEkZUr5V3mbz6ItnXZrSBiMfBk5Q" style="margin-bottom: 20px; display: flex; justify-content: center;"></div>
        
        <button type="submit" style="width: 100%;">Ingresar al Sistema</button>
    </form>
</div>
{% endblock %}
