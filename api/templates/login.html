{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: auto; text-align: center;">
    <h2>Acceso Seguro | Domoblock</h2>
    <p>Ingresa tus datos administrativos para continuar.</p>
    
    <form id="loginForm" method="POST" style="text-align: left;">
        <label>Usuario:</label>
        <input type="text" name="username" required>
        
        <label>Contraseña:</label>
        <input type="password" name="password" required>
        
        <!-- Campo oculto donde Google inyectará el token de seguridad v3 -->
        <input type="hidden" name="g-recaptcha-response" id="g-recaptcha-response">
        
        <button type="submit" style="width: 100%; margin-top: 15px;">Ingresar al Sistema</button>
    </form>
</div>

<!-- Lógica de reCAPTCHA v3 Invisible -->
<script src="https://www.google.com/recaptcha/api.js?render=6Lcomo4tAAAAAEkZUr5V3mbz6ItnXZrSBiMfBk5Q"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Pausamos el envío del formulario
        grecaptcha.ready(function() {
            // Solicitamos el token invisible a Google
            grecaptcha.execute('6Lcomo4tAAAAAEkZUr5V3mbz6ItnXZrSBiMfBk5Q', {action: 'login'}).then(function(token) {
                document.getElementById('g-recaptcha-response').value = token;
                document.getElementById('loginForm').submit(); // Ahora sí enviamos
            });
        });
    });
</script>
{% endblock %}
